# aideation_frontend_angular: liefert die Angular-Oberfläche aus und leitet API und Health-Check an das Backend
# (aideation_backend_nodejs) weiter. Zwei Eingänge mit denselben Routen (app-locations.conf):
# - 8080: direkt vom eigenen Rechner (127.0.0.1:3100). Header des Clients zu IP und Protokoll gelten nicht.
# - 8081: nur für Caddy (Dienst https), ohne Host-Port. Client-IP und Protokoll kommen von Caddy.
# Getrennt nach Port statt nach Absender: Direktzugriffe über den Host-Port kommen vom Gateway desselben
# Docker-Netzes wie Caddy, set_real_ip_from für dieses Netz würde also auch gefälschte Header glauben.

# Caddy setzt X-Forwarded-Proto selbst; nur genau „https“ zählt, alles andere gilt als http.
map $http_x_forwarded_proto $caddy_proto {
  default http;
  https https;
}

server {
  listen 8080;
  # $remote_addr ist die Socket-Adresse; ein vom Client gesetztes X-Forwarded-For/-Proto wird ersetzt.
  set $forwarded_proto $scheme;
  include /etc/nginx/app-locations.conf;
}

server {
  listen 8081;
  # Nicht veröffentlicht, nur aus dem Compose-Netz erreichbar. Caddy ersetzt X-Forwarded-For durch die echte
  # Client-IP; ohne real_ip_recursive zählt nur der letzte Eintrag (auch bei Listen oder mehreren Header-Zeilen).
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;
  set $forwarded_proto $caddy_proto;
  include /etc/nginx/app-locations.conf;
}
