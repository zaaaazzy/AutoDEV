# devlog_frontend_angular: liefert die Angular-Oberfläche aus und leitet API und Health-Check an das Backend
# (devlog_backend_nodejs) weiter. Lauscht im Container auf 8080, von aussen 127.0.0.1:3100 bzw. über Caddy.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  # Anhänge (Bilder) bis 5 MB, etwas Luft für den Rest der Anfrage.
  client_max_body_size 8m;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  location /api/ {
    proxy_pass http://dev-log:3100;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Live-Antworten (Server-Sent Events im Chat, Fortschritt der Agents) sofort durchreichen.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location = /health {
    proxy_pass http://dev-log:3100;
    proxy_set_header Host $http_host;
  }

  # Gebaute Dateien mit Hash im Namen ändern sich nie.
  location ~* ^/(chunk|main|polyfills|styles)-[A-Z0-9]+\.(js|css)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html, Service Worker, Manifest, Symbole: immer frisch prüfen (neue Version sofort sichtbar).
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
