<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIdeation einrichten</title>
    <style>
      :root {
        --ink: #202824;
        --muted: #6d766f;
        --line: #e2e7df;
        --green: #2f6f4f;
        --orange: #d7864e;
        font-family: Inter, 'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(70% 50% at 10% 0%, rgb(215 134 78 / 30%), transparent 60%),
          radial-gradient(60% 50% at 100% 100%, rgb(47 138 87 / 38%), transparent 65%),
          linear-gradient(165deg, #22302a, #141b18);
      }
      .wizard {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        width: min(980px, 100%);
        min-height: min(640px, calc(100vh - 48px));
        overflow: hidden;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 30px 80px rgb(0 0 0 / 35%);
      }
      .rail {
        display: flex;
        flex-direction: column;
        gap: 30px;
        padding: 28px 20px;
        background:
          radial-gradient(120% 60% at 0% 0%, rgb(215 134 78 / 28%), transparent 60%),
          linear-gradient(165deg, #22302a, #18211d);
        color: #eef2ee;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .mark {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 12px 12px 12px 3px;
        background: var(--orange);
        color: var(--ink);
        font-family: Georgia, serif;
        font-size: 26px;
      }
      .brand h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 21px;
        font-weight: 400;
      }
      .brand small {
        color: #e8a87c;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      ol.steps {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      ol.steps li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 10px;
        border-radius: 12px;
        color: #b9c3bc;
      }
      ol.steps li span {
        display: grid;
        width: 30px;
        height: 30px;
        flex: none;
        place-items: center;
        border: 2px solid rgb(255 255 255 / 22%);
        border-radius: 50%;
        font-weight: 700;
      }
      ol.steps li.active {
        background: rgb(255 255 255 / 10%);
        color: #fff;
      }
      ol.steps li.active span {
        border-color: var(--orange);
        background: var(--orange);
        color: var(--ink);
      }
      ol.steps li.done span {
        border-color: #5fbf8a;
        background: #5fbf8a;
        color: #10301f;
      }
      main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-width: 0;
      }
      header {
        padding: 26px 30px 16px;
        border-bottom: 1px solid var(--line);
      }
      header p {
        margin: 0 0 4px;
        color: var(--green);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      header h2 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 28px;
        font-weight: 400;
      }
      section.body {
        overflow: auto;
        padding: 22px 30px;
      }
      .intro {
        margin: 0 0 18px;
        color: #56625a;
      }
      .checks {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .checks li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .badge {
        display: grid;
        width: 24px;
        height: 24px;
        flex: none;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        font-size: 13px;
        font-weight: 800;
      }
      .ok {
        background: #2f8a57;
      }
      .warn {
        background: #e08a1e;
      }
      .bad {
        background: #c9573f;
      }
      .wait {
        background: #c9d1c6;
      }
      .checks small,
      .hint {
        color: var(--muted);
      }
      .checks div {
        display: grid;
        flex: 1;
      }
      label {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
        color: #4b554e;
        font-size: 13px;
        font-weight: 600;
      }
      input[type='text'],
      input[type='password'] {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid #d9e0d6;
        border-radius: 11px;
        font: inherit;
        font-size: 15px;
      }
      input:focus {
        border-color: var(--green);
        outline: none;
        box-shadow: 0 0 0 4px rgb(47 111 79 / 14%);
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row input {
        flex: 1;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 500;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--green);
        background: var(--green);
        color: #fff;
        box-shadow: 0 8px 20px rgb(47 111 79 / 28%);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 30px;
        border-top: 1px solid var(--line);
        background: #fafbf8;
      }
      pre.log {
        max-height: 240px;
        overflow: auto;
        padding: 12px;
        border-radius: 12px;
        background: #1f2924;
        color: #dfe6df;
        font-size: 12px;
        white-space: pre-wrap;
      }
      .error {
        padding: 10px 14px;
        border-radius: 12px;
        background: #fbefec;
        color: #a33d26;
      }
      .done {
        display: grid;
        justify-items: center;
        gap: 12px;
        padding: 40px 0;
        text-align: center;
      }
      .done .mark {
        width: 64px;
        height: 64px;
        font-size: 40px;
      }
      code {
        padding: 1px 5px;
        border-radius: 5px;
        background: #f0f2ee;
      }
      @media (max-width: 760px) {
        body {
          padding: 0;
        }
        .wizard {
          grid-template-columns: 1fr;
          min-height: 100vh;
          border-radius: 0;
        }
        .rail {
          flex-direction: row;
          align-items: center;
          padding: 14px;
        }
        .brand div,
        ol.steps li em {
          display: none;
        }
        ol.steps {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div class="wizard">
      <aside class="rail">
        <div class="brand">
          <span class="mark">m</span>
          <div>
            <small>Einrichtung</small>
            <h1>AIdeation</h1>
          </div>
        </div>
        <ol class="steps" id="steps"></ol>
      </aside>
      <main>
        <header>
          <p id="counter"></p>
          <h2 id="title"></h2>
        </header>
        <section class="body" id="body"></section>
        <footer>
          <button type="button" id="back">← Zurück</button>
          <button type="button" class="primary" id="next">Weiter →</button>
        </footer>
      </main>
    </div>
    <script>
      const token = location.hash.slice(1);
      const api = (path, options = {}) =>
        fetch(path, {
          ...options,
          headers: { 'Content-Type': 'application/json', 'X-Setup-Token': token, ...(options.headers || {}) },
        });
      const STEPS = [
        { id: 'system', label: 'System', title: 'Ist alles bereit?' },
        { id: 'access', label: 'Zugang', title: 'Wie meldest du dich an?' },
        { id: 'options', label: 'Optionen', title: 'Zugriff, Worker und Beispieldaten' },
        { id: 'install', label: 'Installation', title: 'AIdeation wird eingerichtet' },
      ];
      const state = {
        step: 0,
        check: null,
        username: 'admin',
        password: '',
        domain: '',
        projectRoots: '',
        // Standard: Worker im Container (docker compose), sonst auf dem Host (launchd, systemd, Aufgabenplanung).
        workerMode: 'container',
        claudeToken: '',
        demoData: false,
        done: false,
      };
      const $ = (id) => document.getElementById(id);
      const escape = (text) => String(text ?? '').replace(/[&<>"']/g, (char) => `&#${char.charCodeAt(0)};`);

      function generatePassword() {
        const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789-_.';
        const bytes = crypto.getRandomValues(new Uint8Array(24));
        return Array.from(bytes, (byte) => alphabet[byte % alphabet.length]).join('');
      }

      function rail() {
        $('steps').innerHTML = STEPS.map(
          (step, index) =>
            `<li class="${index === state.step ? 'active' : index < state.step ? 'done' : ''}"><span>${index < state.step ? '✓' : index + 1}</span><em>${step.label}</em></li>`,
        ).join('');
        $('counter').textContent = state.done ? 'Fertig' : `Schritt ${state.step + 1} von ${STEPS.length}`;
        $('title').textContent = state.done ? 'Geschafft!' : STEPS[state.step].title;
        $('back').disabled = state.step === 0 || state.step === 3;
        $('next').style.display = state.step === 3 ? 'none' : '';
      }

      function item(ok, title, detail, optional) {
        const cls = ok === null ? 'wait' : ok ? 'ok' : optional ? 'warn' : 'bad';
        const sign = ok === null ? '…' : ok ? '✓' : optional ? '!' : '✕';
        return `<li><span class="badge ${cls}">${sign}</span><div><strong>${title}</strong><small>${detail}</small></div></li>`;
      }

      function renderSystem() {
        const c = state.check;
        const install = {
          docker: 'Docker Desktop installieren und starten: https://docs.docker.com/get-docker/',
          node: 'Node.js 22.12 oder neuer: https://nodejs.org/',
        };
        $('body').innerHTML = `
          <p class="intro">AIdeation läuft in Docker – auf Wunsch auch der Worker, der die Agents startet.</p>
          <ul class="checks">
            ${item(c ? c.node.ok : null, 'Node.js 22.12+', c ? (c.node.ok ? `gefunden: ${escape(c.node.version)}` : `gefunden: ${escape(c.node.version)} – ${install.node}`) : 'wird geprüft …')}
            ${item(c ? c.docker.ok : null, 'Docker läuft', c ? (c.docker.ok ? `Version ${escape(c.docker.version)}` : install.docker) : 'wird geprüft …')}
            ${item(c ? c.compose.ok : null, 'Docker Compose', c ? (c.compose.ok ? escape(c.compose.version) : 'Teil von Docker Desktop') : 'wird geprüft …')}
            ${item(c ? c.git.ok : null, 'Git', c ? (c.git.ok ? escape(c.git.version) : 'https://git-scm.com/downloads') : 'wird geprüft …')}
            ${item(c ? c.claude.ok : null, 'Claude Code (optional)', c ? (c.claude.ok ? escape(c.claude.version) : 'Für die besten Ergebnisse: https://claude.com/claude-code') : '…', true)}
            ${item(c ? c.chromium.ok : null, 'Chromium für Playwright (optional)', c ? (c.chromium.ok ? 'installiert' : 'Wird bei der Installation geladen – für die optische Abnahme und Browser-Spiele (Phaser)') : '…', true)}
            ${item(c ? c.ollama.ok : null, 'Ollama (optional, kostenlos)', c ? (c.ollama.ok ? escape(c.ollama.version) : 'Lokales Modell: https://ollama.com') : '…', true)}
          </ul>
          ${c && c.envExists ? '<p class="hint">Es gibt bereits eine Konfiguration (.env). Sie wird gesichert (<code>.env.bak-…</code>) und ergänzt: Zugang und ausgefüllte Optionen werden gesetzt, alle anderen Werte – auch der Secret Key – bleiben erhalten.</p>' : ''}`;
        $('next').disabled = !c || !c.node.ok || !c.docker.ok || !c.compose.ok;
      }

      function renderAccess() {
        $('body').innerHTML = `
          <p class="intro">Dieser Zugang ist der Systemadministrator. Weitere Benutzer mit Rollen legst du später unter Einstellungen an.</p>
          <label>Benutzername<input type="text" id="username" value="${escape(state.username)}" autocomplete="username" /></label>
          <label>Passwort (mind. 16 Zeichen)
            <span class="row"><input type="text" id="password" value="${escape(state.password)}" autocomplete="new-password" />
            <button type="button" id="gen">Erzeugen</button></span>
          </label>
          <p class="hint">Notiere das Passwort in deinem Passwort-Manager. Es steht auch in der Datei <code>.env</code>.</p>`;
        const update = () => {
          state.username = $('username').value.trim();
          state.password = $('password').value;
          $('next').disabled = !/^[a-zA-Z0-9._-]{3,40}$/.test(state.username) || state.password.length < 16;
        };
        $('username').oninput = update;
        $('password').oninput = update;
        $('gen').onclick = () => {
          $('password').value = generatePassword();
          update();
        };
        update();
      }

      function renderOptions() {
        $('body').innerHTML = `
          <label>Eigene Domain für HTTPS-Zugriff von unterwegs (optional)
            <input type="text" id="domain" value="${escape(state.domain)}" placeholder="devlog.example.com" />
          </label>
          <p class="hint">Mit Domain holt AIdeation automatisch ein Zertifikat; dein Router muss Port 443 an diesen Rechner weiterleiten. Ohne Domain ist AIdeation nur hier unter <code>http://localhost:3100</code> erreichbar.</p>
          <label>Projektbereich – nur hier legt AIdeation Projekte an und arbeiten Agents
            <input type="text" id="roots" value="${escape(state.projectRoots)}" placeholder="z. B. /Users/du/Projekte" />
          </label>
          <p class="hint"><strong>Worker</strong> – startet die Agents und führt Aufträge aus:</p>
          <label class="check"><input type="radio" name="worker" id="worker-container" value="container" ${state.workerMode === 'container' ? 'checked' : ''} /> Worker im Container (empfohlen) – läuft mit <code>docker compose</code>, nichts weiter zu installieren</label>
          <label class="check"><input type="radio" name="worker" id="worker-host" value="host" ${state.workerMode === 'host' ? 'checked' : ''} /> Worker auf diesem Rechner, automatisch beim Anmelden (launchd, systemd bzw. Aufgabenplanung)</label>
          <label class="check"><input type="radio" name="worker" id="worker-none" value="none" ${state.workerMode === 'none' ? 'checked' : ''} /> Später von Hand starten (<code>npm run worker</code>)</label>
          <label>Claude-Token für die Agents (optional, Ausgabe von <code>claude setup-token</code>)
            <input type="password" id="claude-token" value="${escape(state.claudeToken)}" autocomplete="off" placeholder="sk-ant-oat01-…" />
          </label>
          <p class="hint">Die Agents laufen in Docker-Containern ohne dein <code>~/.claude</code>. Der Token steht danach in der <code>.env</code> (<code>CLAUDE_CODE_OAUTH_TOKEN</code>); leer lassen behält einen vorhandenen.</p>
          <label class="check"><input type="checkbox" id="demo" ${state.demoData ? 'checked' : ''} /> Mit Beispielprojekt „Velowerk“ starten</label>
          <p class="hint">Eine Velo-Werkstatt mit einem Jahr Geschichte: 25 Sprints, rund 240 Aufträge, Bugs, Ideen, Agent-Läufe, Kosten und Testberichte. Zum Ausprobieren – der laufende Sprint ist pausiert, Agents starten erst, wenn du ihn fortsetzt. Das Projekt lässt sich später unter Projekt löschen.</p>`;
        $('domain').oninput = () => (state.domain = $('domain').value.trim());
        $('roots').oninput = () => (state.projectRoots = $('roots').value.trim());
        for (const mode of ['container', 'host', 'none'])
          $(`worker-${mode}`).onchange = () => (state.workerMode = mode);
        $('claude-token').oninput = () => (state.claudeToken = $('claude-token').value.trim());
        $('demo').onchange = () => (state.demoData = $('demo').checked);
        $('next').disabled = false;
        $('next').textContent = 'Installieren →';
      }

      async function renderInstall() {
        const labels = {
          env: 'Konfiguration schreiben',
          docker: 'Container bauen und starten',
          health: 'AIdeation antwortet',
          demo: 'Beispieldaten',
          game: 'Spiele-Werkzeuge (Chromium, Phaser-Vorlage)',
          worker: 'Worker einrichten',
        };
        const status = {};
        const lines = [];
        const draw = (message) => {
          $('body').innerHTML = `
            <ul class="checks">${Object.entries(labels)
              .map(([id, label]) => {
                const s = status[id];
                const ok = s
                  ? s.status === 'ok' || s.status === 'skipped'
                    ? true
                    : s.status === 'error'
                      ? false
                      : null
                  : null;
                return item(
                  ok,
                  label,
                  s
                    ? escape(
                        s.note ||
                          (s.status === 'running' ? 'läuft …' : s.status === 'skipped' ? 'übersprungen' : 'erledigt'),
                      )
                    : 'wartet',
                );
              })
              .join('')}</ul>
            ${message || ''}
            <pre class="log">${escape(lines.slice(-200).join('\n'))}</pre>`;
          const log = document.querySelector('pre.log');
          log.scrollTop = log.scrollHeight;
        };
        draw();
        const response = await api('/api/install', {
          method: 'POST',
          body: JSON.stringify({
            username: state.username,
            password: state.password,
            domain: state.domain,
            projectRoots: state.projectRoots,
            installWorker: state.workerMode !== 'none',
            workerContainer: state.workerMode === 'container',
            claudeToken: state.claudeToken,
            demoData: state.demoData,
          }),
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          draw(`<p class="error">${escape(error.message || 'Installation fehlgeschlagen.')}</p>`);
          $('back').disabled = false;
          return;
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n');
          buffer = parts.pop();
          for (const part of parts) {
            if (!part.trim()) continue;
            const event = JSON.parse(part);
            if (event.type === 'log') lines.push(event.line);
            if (event.type === 'step') status[event.id] = event;
            if (event.type === 'done') {
              if (event.ok) return finish(event.url);
              draw('<p class="error">Die Installation ist nicht vollständig durchgelaufen. Details im Protokoll.</p>');
              $('back').disabled = false;
              return;
            }
            draw();
          }
        }
      }

      function finish(url) {
        state.done = true;
        rail();
        $('body').innerHTML = `
          <div class="done">
            <span class="mark">m</span>
            <h3>AIdeation ist eingerichtet</h3>
            <p class="hint">Gleich öffnet sich AIdeation. Melde dich mit <strong>${escape(state.username)}</strong> an – danach begrüßt dich der Projekt-Assistent.</p>
            <button type="button" class="primary" id="open">AIdeation öffnen</button>
          </div>`;
        $('open').onclick = () => (location.href = url);
        $('back').style.display = 'none';
        setTimeout(() => (location.href = url), 4000);
      }

      function render() {
        rail();
        $('next').textContent = 'Weiter →';
        if (state.step === 0) renderSystem();
        if (state.step === 1) renderAccess();
        if (state.step === 2) renderOptions();
        if (state.step === 3) renderInstall();
      }

      $('next').onclick = () => {
        state.step += 1;
        render();
      };
      $('back').onclick = () => {
        state.step = Math.max(0, state.step - 1);
        render();
      };
      state.password = generatePassword();
      render();
      api('/api/check')
        .then((response) => response.json())
        .then((check) => {
          state.check = check;
          if (!state.projectRoots && check.defaultProjectRoot) state.projectRoots = check.defaultProjectRoot;
          if (state.step === 0) renderSystem();
        });
    </script>
  </body>
</html>
