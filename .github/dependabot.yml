version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
  - package-ecosystem: docker
    directories:
      - /
      - /deploy/agent
      - /deploy/frontend
      - /deploy/review
      - /deploy/worker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
