name: CI
on: [push, pull_request]
# Nur Lesen: kein Job schreibt ins Repository, in Issues oder Pakete.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Prüft auch die Test-Dateien (tsconfig.test.json, frontend/tsconfig.spec.json); tsx allein prüft keine Typen.
      - run: npm run typecheck
      - run: npm test

  # Oberflächentests (Playwright) gegen eine eigene Postgres-Instanz.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devlog
          POSTGRES_PASSWORD: devlog_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devlog" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_ADMIN_DATABASE_URL: postgresql://devlog:devlog_ci_only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      # Der Testserver liefert die gebaute Oberfläche aus dist/ui aus.
      - run: npm run build:ui
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            e2e/test-results/
            test-results/
          retention-days: 7

  # Images bauen und starten: Fehler in Dockerfile oder nginx-Konfiguration fallen vor dem Deploy auf.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build dev-log frontend
      - name: Container starten und Health prüfen
        run: |
          # Zufällige Zugangsdaten nur für diesen Lauf, maskiert im Log.
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          DEV_LOG_PASSWORD="$password" docker compose up -d --wait --wait-timeout 180 db dev-log frontend
          curl -fsS http://127.0.0.1:3100/health
      - if: failure()
        run: docker compose logs --no-color --tail 200 dev-log frontend
      - if: always()
        run: docker compose down -v
