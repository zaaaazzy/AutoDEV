services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dev_log
      POSTGRES_USER: ${DEV_LOG_DB_USER:-devlog}
      POSTGRES_PASSWORD: ${DEV_LOG_DB_PASSWORD:-devlog_local_dev}
    volumes:
      - devlog_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_LOG_DB_USER:-devlog} -d dev_log"]
      interval: 5s
      timeout: 5s
      retries: 10

  dev-log:
    build: .
    ports:
      - "${DEV_LOG_BIND:-127.0.0.1}:3100:3100"
    restart: unless-stopped
    environment:
      PORT: 3100
      DEV_LOG_DATABASE_URL: postgresql://${DEV_LOG_DB_USER:-devlog}:${DEV_LOG_DB_PASSWORD:-devlog_local_dev}@db:5432/dev_log
      DEV_LOG_ADMIN_DATABASE_URL: postgresql://${DEV_LOG_DB_USER:-devlog}:${DEV_LOG_DB_PASSWORD:-devlog_local_dev}@db:5432/postgres
      DEV_LOG_AUTH: ${DEV_LOG_AUTH:-on}
      DEV_LOG_HOST: 0.0.0.0
      DEV_LOG_USERNAME: ${DEV_LOG_USERNAME:-devlog}
      DEV_LOG_PASSWORD: ${DEV_LOG_PASSWORD:-}
      DEV_LOG_TRUST_PROXY: ${DEV_LOG_TRUST_PROXY:-}
      DEV_LOG_SECRET_KEY: ${DEV_LOG_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: HTTPS im lokalen Netz (docker compose --profile tls up -d), siehe README.
  tls:
    image: caddy:2.8.4-alpine
    profiles: ["tls"]
    ports:
      - "${DEV_LOG_TLS_BIND:-0.0.0.0}:3443:443"
    environment:
      DEV_LOG_TLS_HOST: ${DEV_LOG_TLS_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - devlog_caddy:/data
    depends_on:
      - dev-log
    restart: unless-stopped

volumes:
  devlog_pgdata:
  devlog_caddy:
