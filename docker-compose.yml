name: aideation
# Containernamen: aideation_<Aufgabe>_<Technik>. Befehle nutzen weiter die Dienstnamen (db, dev-log, frontend, backup, https).
# Härtung: jeder Dienst hat Grenzen für Speicher, CPU und Prozesse (deploy.resources.limits) und einen Healthcheck;
# frontend (nginx), https (Caddy) und backup laufen ohne root und ohne Linux-Capabilities.
# Ohne DEV_LOG_DB_PASSWORD in der .env gilt das bekannte Standardpasswort devlog_local_dev – der Server warnt dann beim Start.
services:
  db:
    image: postgres:17-alpine
    container_name: aideation_database_postgres
    environment:
      POSTGRES_DB: aideation
      POSTGRES_USER: ${DEV_LOG_DB_USER:-devlog}
      POSTGRES_PASSWORD: ${DEV_LOG_DB_PASSWORD:-devlog_local_dev}
    volumes:
      - aideation_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_LOG_DB_USER:-devlog} -d aideation"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g, pids: 512 }

  dev-log:
    build: .
    container_name: aideation_backend_nodejs
    # Kein Port nach aussen: erreichbar über das Frontend (aideation_frontend_angular), das /api weiterleitet.
    restart: unless-stopped
    environment:
      PORT: 3100
      DEV_LOG_TRUST_PROXY: uniquelocal
      DEV_LOG_DOMAIN: ${DEV_LOG_DOMAIN:-}
      # Weitere eigene Domains für die Health-URL der betreuten Anwendungen (Komma-getrennt, inkl. Subdomains).
      DEV_LOG_OWN_DOMAINS: ${DEV_LOG_OWN_DOMAINS:-}
      # Weitere Host-Namen, unter denen AIdeation selbst erreichbar ist (Komma-getrennt, z. B. Tailscale). IPs, localhost,
      # *.local und DEV_LOG_DOMAIN gelten immer; andere Namen weist der Server ab (Schutz vor DNS-Rebinding).
      DEV_LOG_ALLOWED_HOSTS: ${DEV_LOG_ALLOWED_HOSTS:-}
      DEV_LOG_PROJECT_ROOTS: ${DEV_LOG_PROJECT_ROOTS:-}
      DEV_LOG_DATABASE_URL: postgresql://${DEV_LOG_DB_USER:-devlog}:${DEV_LOG_DB_PASSWORD:-devlog_local_dev}@db:5432/aideation
      DEV_LOG_ADMIN_DATABASE_URL: postgresql://${DEV_LOG_DB_USER:-devlog}:${DEV_LOG_DB_PASSWORD:-devlog_local_dev}@db:5432/postgres
      DEV_LOG_AUTH: ${DEV_LOG_AUTH:-on}
      DEV_LOG_HOST: 0.0.0.0
      DEV_LOG_BIND: 127.0.0.1
      DEV_LOG_USERNAME: ${DEV_LOG_USERNAME:-devlog}
      DEV_LOG_PASSWORD: ${DEV_LOG_PASSWORD:-}
      # Erzeugt der Einrichtungs-Assistent einmalig. Nie ändern oder löschen: sonst sind verschlüsselte Werte
      # (Zugangsdaten der Projekte) nicht mehr lesbar. Leer = Werte werden im Klartext gespeichert.
      DEV_LOG_SECRET_KEY: ${DEV_LOG_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g, pids: 512 }

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    container_name: aideation_frontend_angular
    ports:
      # Direkt nur vom eigenen Rechner aus; von aussen geht es über HTTPS (Dienst https).
      - "127.0.0.1:3100:8080"
    restart: unless-stopped
    depends_on:
      dev-log:
        condition: service_healthy
    # Läuft als Benutzer nginx (deploy/frontend/Dockerfile) auf Port 8080 im Container.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m, pids: 128 }

  backup:
    image: postgres:17-alpine
    container_name: aideation_backup_postgres
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    # Benutzer postgres (70:70) des Images. Unter Linux muss ./backups für ihn beschreibbar sein – oder
    # DEV_LOG_BACKUP_USER=<uid>:<gid> des eigenen Benutzers in der .env setzen (der Einrichtungs-Assistent tut das).
    user: "${DEV_LOG_BACKUP_USER:-70:70}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PGHOST: db
      PGUSER: ${DEV_LOG_DB_USER:-devlog}
      PGPASSWORD: ${DEV_LOG_DB_PASSWORD:-devlog_local_dev}
      BACKUP_KEEP_DAYS: ${DEV_LOG_BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    # Gesund, solange ./backups beschreibbar ist und ein Backup jünger als 26 Stunden existiert.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "touch /backups/.health && rm -f /backups/.health && find /backups -maxdepth 1 -name 'aideation-*.dump' -mmin -1560 | grep -q .",
        ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 15m
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m, pids: 64 }

  # HTTPS-Zugang von aussen (optional): nur mit COMPOSE_PROFILES=https und DEV_LOG_DOMAIN in der .env.
  https:
    profiles: ["https"]
    # Caddy als Benutzer caddy (deploy/caddy/Dockerfile); Ports 80/443 im Container ohne root erlaubt (sysctl).
    build: deploy/caddy
    image: aideation-caddy:2.8.4
    container_name: aideation_proxy_caddy
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop: [ALL]
    # /usr/bin/caddy trägt die Datei-Capability cap_net_bind_service; ohne sie im Bounding-Set scheitert der Start.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      DEV_LOG_DOMAIN: ${DEV_LOG_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - aideation_caddy_data:/data
      - aideation_caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      https-volumes:
        condition: service_completed_successfully
    # Admin-API von Caddy (nur im Container auf localhost:2019) antwortet, solange Caddy läuft.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m, pids: 128 }

  # Einmaliger Schritt vor Caddy: Zertifikate in bestehenden Volumes gehören noch root (frühere Fassung lief als root).
  # Übergibt sie dem Benutzer caddy und beendet sich – nur chown, ohne Netzwerk.
  https-volumes:
    profiles: ["https"]
    build: deploy/caddy
    image: aideation-caddy:2.8.4
    container_name: aideation_proxy_caddy_volumes
    user: root
    entrypoint: ["chown", "-R", "caddy:caddy", "/data", "/config"]
    network_mode: none
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - aideation_caddy_data:/data
      - aideation_caddy_config:/config

volumes:
  aideation_pgdata:
    name: aideation_pgdata
  aideation_caddy_data:
    name: aideation_caddy_data
  aideation_caddy_config:
    name: aideation_caddy_config
