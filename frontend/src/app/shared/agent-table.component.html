<app-data-table [rows]="rows()" [columns]="columns" [rowId]="rowKey" [searchable]="searchable()" [emptyText]="empty()">
  <ng-template appDataCell="name" let-row>
    <div class="agent-cell">
      <app-model-icon [command]="row.command" />
      <strong>{{ row.name }}</strong>
      @if (row.hint) {
        <small class="muted">{{ row.hint }}</small>
      }
    </div>
  </ng-template>
  <ng-template appDataCell="status" let-row>
    <span class="status" [ngClass]="row.status | statusClass">{{ row.status | statusLabel }}</span>
  </ng-template>
  <ng-template appDataDetail let-row>
    @if (detail(); as template) {
      <ng-container *ngTemplateOutlet="template; context: { $implicit: row }" />
    }
  </ng-template>
</app-data-table>
