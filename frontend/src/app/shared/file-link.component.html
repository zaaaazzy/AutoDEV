@if (url(); as href) {
  <a [href]="href" target="_blank" rel="noopener" [title]="'Auf GitHub öffnen: ' + path()"
    ><span class="file-icon" aria-hidden="true">↗</span><span class="file-dir">{{ parts().dir }}</span
    ><span class="file-name">{{ parts().name }}</span></a
  >
} @else {
  <span class="file-plain" [title]="path()"
    ><span class="file-dir">{{ parts().dir }}</span
    ><span class="file-name">{{ parts().name }}</span></span
  >
}
