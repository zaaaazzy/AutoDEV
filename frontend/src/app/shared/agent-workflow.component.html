<app-agent-table [rows]="tableRows()" empty="Keine Agents im Workflow.">
  <ng-template let-row>
    @let attached = attachment(row.workflow);
    @let step = row.workflow.step;
    @if (step?.status === 'running' && step?.progress) {
      <p class="live-progress"><span class="live-dot"></span>{{ step?.progress }}</p>
    }
    @if (attached) {
      <details class="run-step" open>
        <summary>{{ attached.label }}</summary>
        <article class="step-output" [innerHTML]="attached.content | markdown"></article>
      </details>
    }
    @if (step) {
      <app-step-result [events]="step.events" [output]="step.output" [running]="step.status === 'running'" />
    } @else {
      <p class="muted">Noch nicht gelaufen.</p>
    }
  </ng-template>
</app-agent-table>
