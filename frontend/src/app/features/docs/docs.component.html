@if (store.ready()) {
  <section class="panel">
    <div class="section-heading">
      <div>
        <h2>Dokumentation</h2>
        <p class="muted">Handbücher, Sprintberichte und Projektdokumente</p>
      </div>
    </div>
    @if (store.showCreate()) {
      <form class="form-grid create-form" (ngSubmit)="createDocument()">
        <label class="wide">Titel<input name="title" [(ngModel)]="docForm.title" maxlength="180" required /> </label>
        <label class="wide"
          >Inhalt<textarea name="content" [(ngModel)]="docForm.content" maxlength="30000" rows="6" required></textarea>
        </label>
        <button class="button primary" type="submit">Dokument speichern</button>
      </form>
    }
    <app-data-table
      [rows]="data().docs"
      [columns]="docColumns"
      [rowId]="docId"
      [initialSort]="[{ id: 'kind', desc: false }]"
      [(expanded)]="openDoc"
      emptyText="Noch keine Dokumente vorhanden."
    >
      <ng-template appDataCell="title" let-doc>
        <button type="button" class="link-button clamp" (click)="toggleDoc(doc.id)">{{ doc.title }}</button>
      </ng-template>
      <ng-template appDataCell="kind" let-doc>
        <span class="tag">{{ documentKindLabel(doc.kind) }}</span>
      </ng-template>
      <ng-template appDataDetail let-doc>
        @if (doc.kind === 'manual') {
          <details class="run-step order-brief">
            <summary>Bearbeiten</summary>
            <form class="form-grid" (ngSubmit)="saveDocument(doc, docEditor.value)" #docEditor="ngForm">
              <label class="wide">Titel<input name="title" [ngModel]="doc.title" maxlength="180" required /> </label>
              <label class="wide"
                >Inhalt<textarea name="content" [ngModel]="doc.content" maxlength="30000" rows="14" required></textarea>
              </label>
              <div class="actions">
                <button class="button primary" type="submit">Speichern</button>
                <button class="button danger" type="button" (click)="deleteDocument(doc.id)">Löschen</button>
              </div>
            </form>
          </details>
        } @else {
          <p class="muted">Automatisch erzeugte Dokumentation ist schreibgeschützt.</p>
        }
        <article class="step-output markdown" [innerHTML]="doc.content | markdown"></article>
      </ng-template>
    </app-data-table>
  </section>
}
