@if (bulkActive() && picked().length) {
  <app-bulk-bar [count]="picked().length" one="Auftrag" many="Aufträge" (cleared)="clearSelection()">
    @if (auth.can('run')) {
      <button
        type="button"
        class="button primary small"
        [disabled]="store.busy() || !retryable().length"
        [title]="
          retryable().length === picked().length
            ? 'Alle gewählten erneut einplanen'
            : 'Nur blockierte, abgelehnte oder aus dem Sprint genommene lassen sich erneut versuchen'
        "
        (click)="retryPicked()"
      >
        ↻ Erneut versuchen ({{ retryable().length }})
      </button>
    }
    @if (auth.can('plan')) {
      <select
        aria-label="Priorität der gewählten setzen"
        [disabled]="store.busy()"
        (change)="setPriority($any($event.target))"
      >
        <option value="">Priorität …</option>
        <option value="high">Hoch</option>
        <option value="medium">Mittel</option>
        <option value="low">Niedrig</option>
      </select>
    }
  </app-bulk-bar>
}
<app-data-table
  class="order-table"
  [rows]="items()"
  [initialFilters]="linkFilters()"
  [columns]="columns()"
  [rowId]="orderId"
  [initialSort]="initialSort()"
  [groupBy]="groupBy()"
  [selectable]="rowSelectable()"
  [(selection)]="selection"
  [selectLabel]="selectLabel"
  [(expanded)]="openOrder"
  [emptyText]="emptyText()"
>
  <ng-template appDataCell="title" let-item>
    <button type="button" class="link-button order-title" [title]="item.title" (click)="toggleOrder(item.id)">
      @if (item.kind === 'bug') {
        <app-bug-icon />
      }
      {{ displayTitle(item) }}
      @if (item.kind === 'express') {
        <span class="express-badge" title="Express-Anfrage aus dem Dashboard – ungeplant in den Sprint aufgenommen"
          >⚡ Express</span
        >
      }
    </button>
  </ng-template>
  <ng-template appDataCell="status" let-item>
    <span class="status" [ngClass]="item.status | statusClass">{{ item.status | statusLabel }}</span>
  </ng-template>
  <ng-template appDataActions let-item>
    @if (extraActions(); as extra) {
      <ng-container *ngTemplateOutlet="extra.template; context: { $implicit: item }" />
    }
    @if (editable()) {
      <button
        type="button"
        class="button secondary icon-button"
        (click)="editOrder(item.id)"
        [attr.aria-label]="'Auftrag bearbeiten: ' + item.title"
        title="Bearbeiten"
      >
        ✎
      </button>
    }
  </ng-template>
  <ng-template appDataDetail let-item>
    @if (customDetail(); as custom) {
      <ng-container *ngTemplateOutlet="custom.template; context: { $implicit: item }" />
    } @else {
      <app-order-detail
        [order]="item"
        [editing]="orderEditing() === item.id"
        [agentsOpen]="agentsOpen()"
        (editCancelled)="orderEditing.set(null)"
        (saved)="saveOrder(item, $event)"
      />
    }
  </ng-template>
</app-data-table>
