@if (store.ready()) {
  <section class="panel">
    <div class="section-heading">
      <div>
        <h2>Aufträge</h2>
        <p class="muted">Backlog, Sprint-Zuordnung und Fortschritt</p>
      </div>
    </div>
    @if (store.showCreate()) {
      <form class="inline-form" (ngSubmit)="createDevelopment()">
        <input
          name="title"
          [(ngModel)]="developmentForm.title"
          placeholder="Neuer Entwicklungsauftrag …"
          maxlength="180"
          required
        />
        <select name="priority" [(ngModel)]="developmentForm.priority" aria-label="Priorität">
          <option value="medium">Mittel</option>
          <option value="high">Hoch</option>
          <option value="low">Niedrig</option>
        </select>
        <button class="button primary" type="submit" [disabled]="busy()">Auftrag hinzufügen</button>
      </form>
    }
    @if (data().development.length) {
      <ng-container
        *ngTemplateOutlet="
          orderTable;
          context: { $implicit: openOrders(), empty: 'Keine offenen Aufträge für diese Filter.' }
        "
      />
    } @else {
      <p class="empty-state">Noch keine Entwicklungsaufträge vorhanden.</p>
    }
  </section>
  <section class="panel">
    <div class="section-heading">
      <button
        type="button"
        class="collapse-toggle"
        [attr.aria-expanded]="showDoneOrders()"
        (click)="showDoneOrders.set(!showDoneOrders())"
      >
        <span class="chev" [class.open]="showDoneOrders()">▸</span> Erledigte Aufträge
        <span class="muted">({{ doneOrders().length }})</span>
      </button>
    </div>
    @if (showDoneOrders()) {
      <ng-container
        *ngTemplateOutlet="orderTable; context: { $implicit: doneOrders(), empty: 'Keine erledigten Aufträge.' }"
      />
    }
  </section>
}
<ng-template #orderTable let-orders let-empty="empty">
  <app-data-table
    [rows]="orders"
    [columns]="devColumns"
    [rowId]="orderId"
    [initialSort]="[{ id: 'priority', desc: true }]"
    [(expanded)]="openOrder"
    [emptyText]="empty"
  >
    <ng-template appDataCell="title" let-item>
      <div class="title-with-hint">
        <button type="button" class="link-button clamp" (click)="toggleOrder(item.id)">{{ item.title }}</button>
        @if (item.description) {
          <span
            class="summary-hint"
            tabindex="0"
            [attr.data-tip]="item.description | shortText: 400"
            [attr.aria-label]="'Kurzfassung: ' + (item.description | shortText: 400)"
            >i</span
          >
        }
      </div>
    </ng-template>
    <ng-template appDataCell="status" let-item>
      <span class="status" [ngClass]="item.status | statusClass">{{ item.status | statusLabel }}</span>
    </ng-template>
    <ng-template appDataActions let-item>
      <button
        type="button"
        class="button secondary icon-button"
        (click)="editOrder(item.id)"
        [attr.aria-label]="'Auftrag bearbeiten: ' + item.title"
        title="Bearbeiten"
      >
        ✎
      </button>
    </ng-template>
    <ng-template appDataDetail let-item>
      <app-order-detail
        [order]="item"
        [editing]="orderEditing() === item.id"
        (editCancelled)="orderEditing.set(null)"
        (saved)="saveOrder(item, $event)"
      />
    </ng-template>
  </app-data-table>
</ng-template>
