@if (store.ready()) {
  <section class="panel">
    <div class="section-heading">
      <div>
        <h2>Testläufe</h2>
        <p class="muted">Die letzten {{ data().runs.length }} Testläufe</p>
      </div>
    </div>
    <app-data-table
      [rows]="data().runs"
      [initialFilters]="store.filtersFor('runs')"
      [columns]="runColumns"
      [rowId]="runId"
      [initialSort]="[{ id: 'startedAt', desc: true }]"
      [(expanded)]="openRun"
      emptyText="Für dieses Projekt gibt es noch keine Testläufe."
    >
      <ng-template appDataCell="status" let-run>
        <span class="status" [ngClass]="run.status | statusClass">{{ run.status | statusLabel }}</span>
      </ng-template>
      <ng-template appDataDetail let-run>
        @for (step of run.steps; track step.position) {
          <details class="run-step">
            <summary>
              <span class="status" [ngClass]="step.status | statusClass">{{ step.status | statusLabel }}</span>
              {{ step.command }} · {{ step.durationMs | duration }}
            </summary>
            <article class="step-output" [innerHTML]="step.output | agentOutput"></article>
          </details>
        } @empty {
          <p class="muted">Keine Schritte aufgezeichnet.</p>
        }
      </ng-template>
    </app-data-table>
  </section>
}
